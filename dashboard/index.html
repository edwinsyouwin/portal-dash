<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Dash</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Weather icon sprite; referenced with <use href="#i-…">. -->
  <svg class="sprite" aria-hidden="true">
    <defs>
      <symbol id="i-sun" viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="8"/>
        <path d="M24 5v6M24 37v6M5 24h6M37 24h6M10.6 10.6l4.2 4.2M33.2 33.2l4.2 4.2M10.6 37.4l4.2-4.2M33.2 14.8l4.2-4.2"/>
      </symbol>
      <symbol id="i-moon" viewBox="0 0 48 48">
        <path d="M38 28.5A15 15 0 0 1 19.5 10 15 15 0 1 0 38 28.5z"/>
      </symbol>
      <symbol id="i-cloud" viewBox="0 0 48 48">
        <path d="M14 36a8 8 0 0 1-.6-16 11 11 0 0 1 21.3-2A9 9 0 0 1 35 36z"/>
      </symbol>
      <symbol id="i-partly" viewBox="0 0 48 48">
        <circle cx="17" cy="16" r="6"/>
        <path d="M17 4v3M5 16h3M8.5 7.5l2.1 2.1M25.5 7.5l-2.1 2.1"/>
        <path d="M17 40a7 7 0 0 1-.5-14 9.5 9.5 0 0 1 18.4-1.7A7.8 7.8 0 0 1 35 40z"/>
      </symbol>
      <symbol id="i-fog" viewBox="0 0 48 48">
        <path d="M14 26a8 8 0 0 1-.6-16 11 11 0 0 1 21.3-2A9 9 0 0 1 35 26z"/>
        <path d="M10 33h28M14 40h20"/>
      </symbol>
      <symbol id="i-rain" viewBox="0 0 48 48">
        <path d="M14 28a8 8 0 0 1-.6-16 11 11 0 0 1 21.3-2A9 9 0 0 1 35 28z"/>
        <path d="M16 34l-2 6M25 34l-2 6M34 34l-2 6"/>
      </symbol>
      <symbol id="i-snow" viewBox="0 0 48 48">
        <path d="M14 28a8 8 0 0 1-.6-16 11 11 0 0 1 21.3-2A9 9 0 0 1 35 28z"/>
        <path d="M15 35v.1M24 35v.1M33 35v.1M19.5 41v.1M28.5 41v.1"/>
      </symbol>
      <symbol id="i-storm" viewBox="0 0 48 48">
        <path d="M14 28a8 8 0 0 1-.6-16 11 11 0 0 1 21.3-2A9 9 0 0 1 35 28z"/>
        <path d="M26 30l-5 7h6l-4 7"/>
      </symbol>
      <symbol id="i-create" viewBox="0 0 48 48">
        <path d="M21 9c1.6 9.6 5.4 13.4 15 15-9.6 1.6-13.4 5.4-15 15-1.6-9.6-5.4-13.4-15-15 9.6-1.6 13.4-5.4 15-15z"/>
        <path d="M38 5v10M33 10h10"/>
      </symbol>
      <symbol id="i-settings" viewBox="0 0 48 48">
        <path d="M7 13h13M30 13h11M7 24h4M21 24h20M7 35h18M35 35h6"/>
        <circle cx="25" cy="13" r="5"/>
        <circle cx="16" cy="24" r="5"/>
        <circle cx="30" cy="35" r="5"/>
      </symbol>
      <symbol id="i-previous" viewBox="0 0 48 48">
        <path d="M29 10L15 24l14 14"/>
      </symbol>
      <symbol id="i-next" viewBox="0 0 48 48">
        <path d="M19 10l14 14-14 14"/>
      </symbol>
      <symbol id="i-video" viewBox="0 0 48 48">
        <rect x="6" y="13" width="24" height="22" rx="5"/>
        <path d="M30 21l11-6v18l-11-6z"/>
      </symbol>
      <symbol id="i-mic" viewBox="0 0 48 48">
        <rect x="18" y="6" width="12" height="22" rx="6"/>
        <path d="M11 23a13 13 0 0 0 26 0M24 36v7M17 43h14"/>
      </symbol>
    </defs>
  </svg>

  <!-- Daily picture; sits behind the dashboard once one has been downloaded. -->
  <div class="photo"><img id="photo-img" alt=""></div>

  <main>
    <div class="clock" id="clock">
      <div class="time"><span id="time">--:--</span><span id="ampm" class="ampm"></span></div>
      <div id="date" class="date"></div>
      <div id="caption" class="caption"></div>
    </div>

    <!-- Calendar events for today and tomorrow; filled in by agenda.js. -->
    <div class="agenda" id="agenda" hidden></div>

    <!-- Spread across the page normally; a compact card when there is a picture. -->
    <div class="weather" id="weather">
      <div class="now" id="now" hidden>
        <div class="now-main">
          <svg class="icon icon-xl"><use id="now-icon" href="#i-cloud"/></svg>
          <span id="now-temp" class="now-temp"></span>
        </div>
        <div id="now-label" class="now-label"></div>
        <div id="now-detail" class="now-detail"></div>
        <div id="now-sun" class="now-detail"></div>
      </div>

      <section class="strip" id="hourly" aria-label="Hourly forecast"></section>
      <section class="strip" id="daily" aria-label="Daily forecast"></section>

      <footer id="status" class="status"></footer>
    </div>
  </main>

  <!-- Round buttons: earlier pictures, a new picture from the Mac, a voice call to
       Muse, and settings. Each shows only when its feature is configured. -->
  <div class="generate" id="generate" data-corner="tr" hidden>
    <span class="pager" id="pager" hidden>
      <button type="button" id="previous-button" aria-label="The picture before">
        <svg class="icon"><use href="#i-previous"/></svg>
      </button>
      <button type="button" id="next-button" aria-label="The picture after">
        <svg class="icon"><use href="#i-next"/></svg>
      </button>
    </span>
    <button type="button" id="generate-button" aria-label="Create a new picture" hidden>
      <svg class="icon"><use href="#i-create"/></svg>
    </button>
    <button type="button" id="voice-button" aria-label="Talk to Muse" hidden>
      <svg class="icon"><use href="#i-mic"/></svg>
    </button>
    <button type="button" id="video-button" aria-label="Video call with Muse" hidden>
      <svg class="icon"><use href="#i-video"/></svg>
    </button>
    <button type="button" id="settings-button" aria-label="Settings" hidden>
      <svg class="icon"><use href="#i-settings"/></svg>
    </button>
    <span id="generate-note" class="generate-note"></span>
  </div>

  <!-- Settings (settings.js), opened by the sliders button. Tap outside to close. -->
  <div class="settings" id="settings" hidden>
    <h2>Settings</h2>
    <p class="setting-name">Change the picture by itself</p>
    <div class="tabs" id="cycle-choices"></div>
    <p class="setting-note">Goes through the pictures already made; it does not make new ones.
      Needs the Mac on.</p>
    <p class="setting-name">The Mac</p>
    <div class="setting-row">
      <span id="mac-status"></span>
      <button type="button" id="mac-scan">Look for the Mac</button>
    </div>
    <p class="setting-note">Pictures, the calendar, tasks and Muse come from the Mac. If it
      has moved to another network, this finds it again.</p>
  </div>

  <!-- News about changes to the dashboard itself (control.js). Tap to dismiss. -->
  <div class="notice" id="notice" hidden></div>

  <!-- A countdown started by Muse (control.js). Tap to dismiss. -->
  <div class="timer" id="timer" hidden>
    <div id="timer-label" class="timer-label"></div>
    <div id="timer-time" class="timer-time"></div>
    <div class="timer-bar"><span id="timer-fill"></span></div>
  </div>

  <!-- Muse's picture during a video call, over the whole dashboard. Tap to hang up. -->
  <div class="call-video" id="call-video" hidden><canvas id="call-canvas"></canvas></div>

  <!-- What the call to Muse is doing, and what Muse is saying. Tap to hang up. -->
  <div class="voice" id="voice" hidden><span class="voice-dot"></span><span id="voice-text"></span></div>

  <script type="module" src="app.js"></script>
</body>
</html>
